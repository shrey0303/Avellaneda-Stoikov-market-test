name: live

# After every US trading day: fetch the day's IEX quotes and trades from Alpaca,
# trade the A-S strategies on it, and commit the updated reports in results/live.
# Every run also catches up any weekday since SINCE that is not on disk yet.

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC: 17:30 New York in summer, 16:30 in winter
  workflow_dispatch:
    inputs:
      since:
        description: "first day to trade (YYYY-MM-DD)"
        required: false
        default: "2026-10-01"

env:
  SINCE: "2026-10-01"
  PYTHONUNBUFFERED: "1"   # show each stock-day in the log as it finishes

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Trade the finished days
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python -m lobreplay live --since "${{ inputs.since || env.SINCE }}"

      - name: Commit the reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/live
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "Live results through $(date -u +%F)"
            git push
          fi
