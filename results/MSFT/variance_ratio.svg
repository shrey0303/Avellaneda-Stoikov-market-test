<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Variance ratio of the mid price">
<style>
.surface{fill:#fcfcfb}.title{fill:#0b0b0b;font-weight:600;font-size:14px}
.sub,.legend{fill:#52514e;font-size:12px}.tick{fill:#898781;font-size:11px;font-variant-numeric:tabular-nums}
.grid{stroke:#e1e0d9;stroke-width:1}.axis{stroke:#c3c2b7;stroke-width:1}.ref{stroke:#898781;stroke-width:1}
.s1{stroke:#2a78d6}.s2{stroke:#eb6834}.f1{fill:#2a78d6}.f2{fill:#eb6834}
.line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dot{stroke:#fcfcfb;stroke-width:2}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme: dark){
.surface{fill:#1a1a19}.title{fill:#ffffff}.sub,.legend{fill:#c3c2b7}
.grid{stroke:#2c2c2a}.axis{stroke:#383835}.dot{stroke:#1a1a19}
.s1{stroke:#3987e5}.s2{stroke:#d95926}.f1{fill:#3987e5}.f2{fill:#d95926}}
</style>
<rect class="surface" width="640" height="360" rx="8"/>
<text class="title" x="64" y="26">Variance ratio of the mid price</text>
<text class="sub" x="64" y="44">Per-second variance at each horizon, relative to the longest. The rule marks 1.</text>
<line class="grid" x1="64" x2="616" y1="312.0" y2="312.0"/>
<text class="tick" x="56" y="316.0" text-anchor="end">0.6</text>
<line class="grid" x1="64" x2="616" y1="253.0" y2="253.0"/>
<text class="tick" x="56" y="257.0" text-anchor="end">0.7</text>
<line class="grid" x1="64" x2="616" y1="194.0" y2="194.0"/>
<text class="tick" x="56" y="198.0" text-anchor="end">0.8</text>
<line class="grid" x1="64" x2="616" y1="135.0" y2="135.0"/>
<text class="tick" x="56" y="139.0" text-anchor="end">0.9</text>
<line class="grid" x1="64" x2="616" y1="76.0" y2="76.0"/>
<text class="tick" x="56" y="80.0" text-anchor="end">1</text>
<line class="axis" x1="64" x2="616" y1="312" y2="312"/>
<text class="tick" x="64.0" y="330" text-anchor="middle">1</text>
<text class="tick" x="131.1" y="330" text-anchor="middle">2</text>
<text class="tick" x="219.8" y="330" text-anchor="middle">5</text>
<text class="tick" x="286.8" y="330" text-anchor="middle">10</text>
<text class="tick" x="393.2" y="330" text-anchor="middle">30</text>
<text class="tick" x="460.2" y="330" text-anchor="middle">60</text>
<text class="tick" x="527.3" y="330" text-anchor="middle">120</text>
<text class="tick" x="616.0" y="330" text-anchor="middle">300</text>
<text class="sub" x="340.0" y="350" text-anchor="middle">horizon (s)</text>
<line class="ref" x1="64" x2="616" y1="76.0" y2="76.0"/>
<polyline class="line s1" points="64.0,267.4 131.1,262.7 219.8,279.3 286.8,253.0 393.2,282.1 460.2,276.3 527.3,273.2 616.0,76.0"/>
<circle class="dot f1" cx="64.0" cy="267.4" r="5"><title>variance ratio: 0.676 at horizon (s) 1</title></circle>
<circle class="dot f1" cx="131.1" cy="262.7" r="5"><title>variance ratio: 0.684 at horizon (s) 2</title></circle>
<circle class="dot f1" cx="219.8" cy="279.3" r="5"><title>variance ratio: 0.655 at horizon (s) 5</title></circle>
<circle class="dot f1" cx="286.8" cy="253.0" r="5"><title>variance ratio: 0.7 at horizon (s) 10</title></circle>
<circle class="dot f1" cx="393.2" cy="282.1" r="5"><title>variance ratio: 0.651 at horizon (s) 30</title></circle>
<circle class="dot f1" cx="460.2" cy="276.3" r="5"><title>variance ratio: 0.661 at horizon (s) 60</title></circle>
<circle class="dot f1" cx="527.3" cy="273.2" r="5"><title>variance ratio: 0.666 at horizon (s) 120</title></circle>
<circle class="dot f1" cx="616.0" cy="76.0" r="5"><title>variance ratio: 1 at horizon (s) 300</title></circle>
</svg>
