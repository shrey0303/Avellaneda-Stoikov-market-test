<polyline class="line s2" points="64.0,104.0 174.4,227.5 284.8,277.6 395.2,298.0 505.6,306.3 616.0,309.7"/>
<circle class="dot f2" cx="64.0" cy="104.0" r="7"><title>fitted: 0.0132 at ticks behind the touch 0</title></circle>
<circle class="dot f2" cx="174.4" cy="227.5" r="7"><title>fitted: 0.00537 at ticks behind the touch 1</title></circle>
