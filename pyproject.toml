[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lobreplay"
version = "0.1.0"
description = "Avellaneda-Stoikov on real NASDAQ order book data (LOBSTER): book replay, queue tracking, calibration and strategy study"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lobreplay = "lobreplay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
